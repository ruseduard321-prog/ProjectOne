name: CI

# Every push and every pull request. Established while the codebase is still a
# skeleton so that every later step lands into a pipeline already policing it,
# rather than having quality gates retrofitted onto existing work (STEP-06).
on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run. Without this, a burst
# of commits queues redundant runs and the useful result is the last one anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default (CLAUDE.md §16, least privilege). A job needing more
# must widen its own scope explicitly, which makes the widening reviewable.
permissions:
  contents: read

jobs:
  # The root CLAUDE.md and AGENTS.md are generated from canonical sources in
  # `ProjectOne Vault/00 Governance/`. Nothing enforced that before: a
  # contributor could edit a canonical source, forget to regenerate, and leave
  # the root file — the one the agent harnesses actually read — describing older
  # rules than the vault it claims to mirror.
  #
  # Cheap and dependency-free, so it runs first and fails fast. `pytest` also
  # asserts this (tests/test_governance_docs_sync.py) for contributors who run
  # the suite locally.
  #
  # A MERGE GATE since 2026-08-11. The `Protect main` ruleset lists this job's
  # check name among its required status checks alongside `web` and `api`, so
  # governance drift now blocks the merge button rather than merely reporting
  # itself. Verified against the ruleset API during STEP-25a (FA-08).
  #
  # The check name below is therefore load-bearing: the ruleset matches on the
  # literal string, so renaming this job silently removes the gate — the
  # ruleset would keep requiring a check that no longer reports. If it must be
  # renamed, the ruleset entry has to be updated in the same change, and only
  # the project owner can do that.
  governance-docs:
    name: governance docs (sync check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify generated documents match their canonical sources
        run: ./scripts/sync-governance-docs.sh --check

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    # Non-secret placeholders. Both apps refuse to start without validated
    # configuration (STEP-05), so a pipeline that omits these is red on arrival.
    # These are the .env.example defaults: CI needs no real credential, and
    # repository secrets are deliberately not wired in here — there is nothing
    # yet that CI is entitled to read.
    env:
      NEXT_PUBLIC_PROJECTONE_ENVIRONMENT: development
      NEXT_PUBLIC_PROJECTONE_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted, which is the property
      # that makes a CI run reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build last: it is the slowest step and the one most likely to surface a
      # problem the faster checks already caught more cheaply.
      - name: Build
        run: npm run build

  api:
    name: api (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # A throwaway PostgreSQL for the RLS isolation tests (STEP-09), which assert
    # what the database itself does with a policy and so cannot be stubbed — a
    # false pass there is a cross-tenant data breach (CLAUDE.md §16).
    #
    # Ephemeral and created per run, never the development Supabase project: the
    # tests write and delete rows, and CI is granted a database it can safely
    # destroy rather than one holding real data (least privilege, §16). The
    # image is stock `postgres`, so Supabase's `auth.uid()` is absent and the
    # test harness shims it — see apps/api/tests/conftest.py.
    services:
      postgres:
        # Pinned to the major version the development project runs (17.6), so
        # CI cannot pass against policy behaviour a different server would treat
        # differently.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: projectone_test
        ports:
          - 5432:5432
        # Without this the job races the container: the first connection can
        # arrive before the server accepts them, which fails intermittently —
        # the worst kind of CI failure to diagnose.
        #
        # `--health-start-period` was added after run #28 failed in "Initialize
        # containers" after 55s on a commit that touched only test files and
        # documentation — it changed nothing the container depends on, and the
        # immediately preceding run started the same image in 23s.
        #
        # Without a start period the retry clock begins immediately, so the
        # allowance is a flat 50s (5 retries x 10s) covering image pull, initdb
        # AND readiness. `postgres:17` runs initdb on first boot, which on a cold
        # runner is most of that budget. The start period gives initialization
        # 30s that does not count against the retries, so a slow pull no longer
        # consumes the health allowance.
        #
        # This is not a weakened check. The health command, interval and timeout
        # are unchanged, and the job still fails if the server never becomes
        # ready — it just no longer fails a *healthy* server for booting slowly.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    # Non-secret placeholders. These are required settings, so the app refuses
    # to start without them and CI would be red on arrival (STEP-05/STEP-07).
    #
    # SUPABASE_URL and SUPABASE_SECRET_KEY remain deliberately fake: nothing in
    # CI authenticates against a Supabase project, and a real key here would
    # grant access the pipeline has no use for.
    #
    # DATABASE_URL points at the throwaway service container above rather than
    # at a real project. PROJECTONE_TEST_DATABASE_URL is what the isolation
    # tests read; they skip when it is unset, so it is set explicitly here to
    # keep that coverage from being lost silently.
    #
    # REQUEST_DATABASE_URL is required for the app to start (STEP-10). The value
    # here is only the startup placeholder — the tests that genuinely exercise
    # the request-path role build their own URL from the `authenticator` role
    # that `conftest.py` provisions, because the password must match one this
    # workflow does not own.
    #
    # PROJECTONE_BYOK_ENCRYPTION_KEY became required in STEP-17, and the value
    # below is deliberately the SAME constant as `tests.conftest.TEST_BYOK_KEY`,
    # not a second one that happens to be valid. Two independently-valid keys
    # would both work, which is exactly why they would drift; pinning them
    # together means CI validates the value the suite actually exercises.
    # `test_ci_configuration.py` asserts they stay equal.
    #
    # It is NOT a secret and must never become one. Base64 of the ASCII string
    # `test-byok-key-32-bytes-long-xxxx` — valid AES-256 by length, and readable
    # at a glance as a fixture, so nobody mistakes this line for a leaked key or
    # copies it into a deployment. CI encrypts nothing that outlives the run:
    # the database is a per-run throwaway container, and the tests that genuinely
    # exercise encryption generate their own random keys.
    #
    # Production is unaffected. `byok_encryption_key` still has no default in
    # `app/core/config.py`, so a real deployment that omits it still refuses to
    # start (CLAUDE.md §16, §28a). This supplies the variable to one ephemeral
    # environment rather than weakening the requirement for every environment,
    # which a default would have done.
    env:
      PROJECTONE_ENVIRONMENT: development
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_not_a_real_key
      DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/projectone_test
      REQUEST_DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/projectone_test
      PROJECTONE_TEST_DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/projectone_test
      PROJECTONE_BYOK_ENCRYPTION_KEY: dGVzdC1ieW9rLWtleS0zMi1ieXRlcy1sb25nLXh4eHg=

    steps:
      - uses: actions/checkout@v4

      # Matches the `requires-python = ">=3.12"` floor in pyproject.toml, not
      # the newer interpreter that happens to be on a developer machine. CI
      # verifies the oldest supported version; anything newer is a bonus, not
      # the contract (STEP-04).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      # Run #28 failed in "Initialize containers" with no artifact and no step
      # summary, because both of those only fire after the Test step — so a
      # container failure produced a red run and zero diagnostics.
      #
      # This asserts the service is actually reachable, and prints the server
      # version into the log if it is. It costs a second on a healthy run and
      # turns "Initialize containers failed" into a line naming what was wrong.
      #
      # It is a diagnostic, not a gate that can mask anything: the tests below
      # still fail on their own if the database misbehaves, and
      # PROJECTONE_REQUIRE_DATABASE_TESTS still turns a skip into a failure.
      - name: Verify the database service is reachable
        run: |
          python - <<'PY'
          import os, sys, psycopg
          dsn = os.environ["PROJECTONE_TEST_DATABASE_URL"]
          try:
              with psycopg.connect(dsn, connect_timeout=10) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SELECT version()")
                      row = cursor.fetchone()
              print("database reachable:", row[0] if row else "<no row>")
          except Exception as error:
              print(f"database UNREACHABLE: {type(error).__name__}: {error}")
              sys.exit(1)
          PY

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy app

      # `-ra` reports skip reasons in the summary, so a skipped isolation test
      # is visible in the log rather than hidden behind a green tick.
      #
      # PROJECTONE_REQUIRE_DATABASE_TESTS turns the isolation tests' skip into a
      # hard failure. Those tests skip when no database is configured — correct
      # on a developer machine without PostgreSQL, wrong here. Without it, a
      # broken service container would silently downgrade the security suite to
      # skips and CI would still report green, losing precisely the coverage
      # this job exists to provide.
      # `pipefail` is essential: without it the pipeline reports `tee`'s exit
      # code, so a failing suite would be reported as green — a far worse
      # failure than the unreadable log this captures.
      - name: Test
        env:
          PROJECTONE_REQUIRE_DATABASE_TESTS: '1'
        shell: bash
        run: |
          set -o pipefail
          pytest -ra --tb=short | tee pytest-output.txt

      # STEP-25a, FA-02. The audit confirmed by inspection that all 18
      # migrations have non-empty downgrade bodies and that the history is
      # linear, and neither fact proves a downgrade *works* — a dropped object
      # another migration depends on fails only at runtime. Nothing exercised
      # the reverse direction anywhere, including this job, which applies
      # migrations forward and stops.
      #
      # The drill runs `upgrade head -> downgrade base -> upgrade head` and
      # compares the twice-migrated schema against the once-migrated one, so a
      # downgrade that leaves a table behind or an upgrade that rebuilds a
      # column differently is caught rather than exiting zero.
      #
      # After the test suite, deliberately: both drills rewrite the schema
      # destructively, and running them first would hand the isolation tests a
      # database in a state they do not expect.
      # Output is teed and echoed into the step summary on failure, for the same
      # reason the pytest step does it: job logs need admin rights to download,
      # so without this a red drill tells a contributor *that* the downgrade
      # path is broken and nothing about where or why.
      - name: Verify migrations reverse (FA-02)
        shell: bash
        run: |
          set -o pipefail
          python scripts/migration_cycle_drill.py 2>&1 | tee migration-drill.txt

      - name: Report migration drill failure
        if: failure()
        shell: bash
        run: |
          if [ -f migration-drill.txt ]; then
            echo '## FA-02 migration cycle' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 30000 migration-drill.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # STEP-25a, FA-03. The audit recorded restore as the single largest
      # unproven guarantee in the Foundation: a documented strategy, no restore
      # ever performed, and no RPO/RTO values. This seeds two workspaces, dumps,
      # restores into a *separate empty* database, and verifies schema and
      # per-workspace data — two tenants so the restore is provably
      # tenant-correct rather than merely non-empty.
      #
      # Runs here rather than on a developer machine because this is where a
      # disposable PostgreSQL exists, and because a drill that runs on every PR
      # keeps proving itself, while one run once on a laptop proves it once.
      # `pg_dump` refuses to dump a server newer than itself, and the service
      # container is pinned to 17. The runner's default client tracks whatever
      # Ubuntu ships, so this installs the matching major version explicitly
      # rather than leaving the drill to fail on a version mismatch that has
      # nothing to do with the backup being tested.
      - name: Install PostgreSQL 17 client
        if: always()
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Installing is not enough. The runner ships an older client at
          # /usr/bin/pg_dump, and the versioned packages land in
          # /usr/lib/postgresql/17/bin -- so PATH still resolves to 16 and
          # `pg_dump` refuses the newer server. Prepending the versioned
          # directory to PATH for subsequent steps is what actually selects it.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # `if: always()` so a broken downgrade does not also hide whether restore
      # works. They are separate findings and each deserves its own answer;
      # skipping this on FA-02's failure would have cost a full CI round trip
      # to learn something this run could already have told us.
      - name: Verify backup and restore (FA-03)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/backup_restore_drill.py 2>&1 | tee restore-drill.txt

      - name: Report restore drill failure
        if: failure()
        shell: bash
        run: |
          if [ -f restore-drill.txt ]; then
            echo '## FA-03 backup and restore' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 30000 restore-drill.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Job logs need admin rights on this repository to download, so a
      # contributor without them can see *that* the suite failed but not *why* —
      # which turns a one-line fix into several blind round-trips. The step
      # summary is readable by anyone who can see the run, so the failure
      # travels with it.
      #
      # `if: failure()` so a green run stays quiet, and `tail` so a large
      # failure cannot bury the summary.
      #
      # The file-existence branch matters: when the job fails *before* pytest
      # runs — a failed service container, a dependency install error — this
      # step used to `tail` a file that was never created and fail itself,
      # adding a second red step that pointed at nothing. Run #28 failed exactly
      # that way and produced no usable diagnostic at all. Saying plainly that
      # the suite never ran is the more useful output.
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          echo '## API test failures' >> "$GITHUB_STEP_SUMMARY"
          if [ -f pytest-output.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 60000 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The test suite never ran — the job failed before pytest started.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Check the *Initialize containers* and *Verify the database service is reachable* steps.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Downloading job logs requires admin rights on this repository, but
      # artifacts do not — so the same output is also uploaded, keeping a failing
      # run diagnosable by anyone who can see it rather than only by an admin.
      # The step summary carries these too, but it is not reachable through the
      # REST API — only the web UI — so a contributor debugging from a terminal
      # could see the drill failed and not why. An artifact is API-readable,
      # which is the difference between a diagnostic and a dead end.
      - name: Upload drill output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-drill-output
          path: |
            apps/api/migration-drill.txt
            apps/api/restore-drill.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-output
          path: apps/api/pytest-output.txt
          retention-days: 7
          # The file is absent whenever the job failed before pytest ran. The
          # default `warn` already tolerates that, but stating it means the
          # absence is a deliberate, documented case rather than a warning
          # somebody has to interpret.
          if-no-files-found: ignore
