name: CI

# Every push and every pull request. Established while the codebase is still a
# skeleton so that every later step lands into a pipeline already policing it,
# rather than having quality gates retrofitted onto existing work (STEP-06).
on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run. Without this, a burst
# of commits queues redundant runs and the useful result is the last one anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default (CLAUDE.md §16, least privilege). A job needing more
# must widen its own scope explicitly, which makes the widening reviewable.
permissions:
  contents: read

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    # Non-secret placeholders. Both apps refuse to start without validated
    # configuration (STEP-05), so a pipeline that omits these is red on arrival.
    # These are the .env.example defaults: CI needs no real credential, and
    # repository secrets are deliberately not wired in here — there is nothing
    # yet that CI is entitled to read.
    env:
      NEXT_PUBLIC_PROJECTONE_ENVIRONMENT: development
      NEXT_PUBLIC_PROJECTONE_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted, which is the property
      # that makes a CI run reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build last: it is the slowest step and the one most likely to surface a
      # problem the faster checks already caught more cheaply.
      - name: Build
        run: npm run build

  api:
    name: api (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # A throwaway PostgreSQL for the RLS isolation tests (STEP-09), which assert
    # what the database itself does with a policy and so cannot be stubbed — a
    # false pass there is a cross-tenant data breach (CLAUDE.md §16).
    #
    # Ephemeral and created per run, never the development Supabase project: the
    # tests write and delete rows, and CI is granted a database it can safely
    # destroy rather than one holding real data (least privilege, §16). The
    # image is stock `postgres`, so Supabase's `auth.uid()` is absent and the
    # test harness shims it — see apps/api/tests/conftest.py.
    services:
      postgres:
        # Pinned to the major version the development project runs (17.6), so
        # CI cannot pass against policy behaviour a different server would treat
        # differently.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: projectone_test
        ports:
          - 5432:5432
        # Without this the job races the container: the first connection can
        # arrive before the server accepts them, which fails intermittently —
        # the worst kind of CI failure to diagnose.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Non-secret placeholders. These are required settings, so the app refuses
    # to start without them and CI would be red on arrival (STEP-05/STEP-07).
    #
    # SUPABASE_URL and SUPABASE_SECRET_KEY remain deliberately fake: nothing in
    # CI authenticates against a Supabase project, and a real key here would
    # grant access the pipeline has no use for.
    #
    # DATABASE_URL points at the throwaway service container above rather than
    # at a real project. PROJECTONE_TEST_DATABASE_URL is what the isolation
    # tests read; they skip when it is unset, so it is set explicitly here to
    # keep that coverage from being lost silently.
    env:
      PROJECTONE_ENVIRONMENT: development
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_not_a_real_key
      DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/projectone_test
      PROJECTONE_TEST_DATABASE_URL: postgresql://postgres:ci-throwaway@127.0.0.1:5432/projectone_test

    steps:
      - uses: actions/checkout@v4

      # Matches the `requires-python = ">=3.12"` floor in pyproject.toml, not
      # the newer interpreter that happens to be on a developer machine. CI
      # verifies the oldest supported version; anything newer is a bonus, not
      # the contract (STEP-04).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy app

      # `-ra` reports skip reasons in the summary, so a skipped isolation test
      # is visible in the log rather than hidden behind a green tick.
      #
      # PROJECTONE_REQUIRE_DATABASE_TESTS turns the isolation tests' skip into a
      # hard failure. Those tests skip when no database is configured — correct
      # on a developer machine without PostgreSQL, wrong here. Without it, a
      # broken service container would silently downgrade the security suite to
      # skips and CI would still report green, losing precisely the coverage
      # this job exists to provide.
      - name: Test
        env:
          PROJECTONE_REQUIRE_DATABASE_TESTS: '1'
        run: pytest -ra
