[project]
name = "projectone-api"
version = "0.1.0"
description = "ProjectOne backend API."
requires-python = ">=3.12"

# Pinned exactly. A skeleton that resolves to different versions on different
# machines is not a reproducible baseline (Environment Setup).
dependencies = [
    "alembic==1.18.5",
    # Cloudflare R2 is reached through its S3-compatible API (ADR-004), and
    # Cloudflare's own documentation lists boto3 as a supported client for it.
    # Confined to app/storage/providers/ -- tests/test_storage_boundary.py
    # asserts it cannot be imported above the adapter boundary.
    "boto3==1.43.72",
    "fastapi==0.121.2",
    # Supabase signs access tokens with ES256, so verification needs asymmetric
    # crypto — the [crypto] extra pulls in `cryptography` for that. PyJWT rather
    # than a hand-rolled verifier because signature verification is the kind of
    # code that fails silently and catastrophically when written from scratch.
    "pyjwt[crypto]==2.13.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.10",
    # [email] supplies the validator behind EmailStr. Validating an address at
    # the schema boundary is cheaper and safer than discovering it is malformed
    # after it has reached the identity provider (CLAUDE.md §12).
    "pydantic[email]==2.12.4",
    "pydantic-settings==2.13.1",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
    # httpx is a runtime dependency as of STEP-10 (the Supabase Auth API is
    # HTTP), so it is no longer listed here — TestClient still gets it.
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.14.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen to enforce what CLAUDE.md already requires rather than to maximise
# rule count: pyflakes/pycodestyle correctness, import order, bugbear traps,
# and ANN so public signatures stay explicitly typed (CLAUDE.md 11, 27).
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "D"]
ignore = [
    "D203",  # conflicts with D211 -- ruff recommends selecting one
    "D213",  # conflicts with D212 -- multi-line summary style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
# Alembic generates these from its own template, with a fixed header format and
# module-level names (revision, down_revision) it requires verbatim. Enforcing
# our docstring and naming conventions on machine-generated scaffolding means
# hand-editing every new migration to satisfy a linter — so the generated shape
# is accepted and review attention goes to the upgrade/downgrade bodies, which
# are hand-written and do carry docstrings.
"migrations/versions/*" = ["D", "N"]
"migrations/env.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# strict already implies disallow_any_generics, disallow_untyped_defs and
# warn_return_any -- together these are the Python equivalent of "no `any`"
# (CLAUDE.md 35).
#
# disallow_any_explicit is deliberately NOT enabled. Pydantic's BaseModel and
# BaseSettings use explicit Any in their own signatures, so the flag reports an
# error on every model's class declaration -- code we do not own and cannot
# fix. It would make every schema in the codebase permanently unclean, which
# trains people to ignore mypy output rather than to avoid Any.

# boto3 ships no type stubs and no py.typed marker, so `strict` reports its
# import as untyped. Scoped to this one module rather than relaxed globally: the
# untyped surface is confined to `app/storage/factory.py`, which is the only
# place the SDK is imported at all, and the client it returns is immediately
# held behind the vendor-neutral StorageProvider boundary (ADR-004 3).
#
# The alternative -- adding `boto3-stubs` -- is a second dependency carrying its
# own version coupling to boto3, for a single `client()` call whose result is
# deliberately typed `Any` at the adapter edge anyway.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
